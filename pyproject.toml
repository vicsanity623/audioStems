[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-server"
version = "2.0.0"
description = "Self-hosted AI media processing suite — background removal, upscaling, AI generation (SD/IP-Adapter), and audio stem separation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    # Web Server
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydub>=0.25.0",

    # UI
    "gradio>=6.7.0",

    # Core AI Frameworks
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "diffusers==0.30.0",
    "transformers==4.48.0",
    "accelerate>=1.14.0",

    # Intel Mac pinning
    "llvmlite==0.42.0",
    "numba==0.59.1",
    "numpy>=1.26,<1.27",

    # Model Frameworks
    "transparent-background>=1.3.0",
    "demucs>=4.0.0",

    # Utilities
    "Pillow>=11.0.0",
    "opencv-python-headless>=4.11.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
ai-media-server = "media_server.app:main"

[tool.setuptools.packages.find]
include = ["media_server*"]
